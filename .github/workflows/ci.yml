name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci

  windows-package:
    needs: checks
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:win
      - name: Install and verify packaged application
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release -Filter 'LitRoot-*-windows-x64-unsigned-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP 'litroot-install'
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installDir) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $executable = Resolve-Path (Join-Path $installDir 'LitRoot.exe')
          $service = Resolve-Path (Join-Path $installDir 'resources/service/litroot-service.cjs')
          if ((Get-Item $service).Length -le 0) { throw 'Packaged WSL service is empty.' }
          pnpm run test:packaged-service -- $executable $service
          if ($LASTEXITCODE -ne 0) { throw "Packaged service check exited with code $LASTEXITCODE." }
      - name: Uninstall packaged application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'litroot-install'
          $uninstaller = Resolve-Path (Join-Path $installDir 'unins000.exe')
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path (Join-Path $installDir 'LitRoot.exe')) { throw 'LitRoot.exe remains after uninstall.' }
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release -Filter 'LitRoot-*-windows-x64-unsigned-setup.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $hash = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$($installer[0].FullName).sha256" "$hash  $($installer[0].Name)" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: litroot-${{ github.sha }}-windows-x64-unsigned
          path: |
            release/LitRoot-*-windows-x64-unsigned-setup.exe
            release/LitRoot-*-windows-x64-unsigned-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  linux-package:
    needs: checks
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:linux
      - name: Verify packaged native service runtime
        run: pnpm run test:packaged-service -- release/linux-unpacked/litroot release/linux-unpacked/resources/service/litroot-service.cjs
      - name: Write SHA-256 checksums
        run: sha256sum release/*.AppImage release/*.deb > release/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: litroot-${{ github.sha }}-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

  macos-package:
    needs: checks
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:mac
      - name: Verify packaged native service runtime
        run: pnpm run test:packaged-service -- release/mac-arm64/LitRoot.app/Contents/MacOS/LitRoot release/mac-arm64/LitRoot.app/Contents/Resources/service/litroot-service.cjs
      - name: Write SHA-256 checksum
        run: shasum -a 256 release/*.dmg > release/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: litroot-${{ github.sha }}-macos-arm64-unsigned
          path: |
            release/*.dmg
            release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
