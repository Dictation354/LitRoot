appId: io.litroot.desktop
productName: LitRoot
asar: true

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!docs/**'
  - '!src/**'
  - '!tests/**'
  - '!scripts/**'

extraResources:
  - from: resources/litroot-app-icon.png
    to: litroot-app-icon.png
  - from: dist/service/litroot-service.cjs
    to: service/litroot-service.cjs

mac:
  icon: resources/litroot-app-icon.png
  category: public.app-category.productivity
  minimumSystemVersion: '15.0'
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
  artifactName: '${productName}-${version}-macos-${arch}-unsigned.${ext}'

linux:
  icon: resources/litroot-app-icon.png
  category: Office
  maintainer: 'Dictation354 <Dictation354@users.noreply.github.com>'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: '${productName}-${version}-linux-${arch}.${ext}'

win:
  icon: resources/litroot-app-icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: '${productName}-${version}-windows-${arch}-unsigned-setup.${ext}'

nsis:
  oneClick: true
  perMachine: false
  packElevateHelper: false

dmg:
  sign: false

publish: null
