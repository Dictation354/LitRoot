appId: io.litroot.desktop
productName: LitRoot
asar: true

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!docs/**'
  - '!src/**'
  - '!tests/**'
  - '!scripts/**'

extraResources:
  - from: resources/litroot-app-icon.png
    to: litroot-app-icon.png
  - from: dist/service/litroot-service.cjs
    to: service/litroot-service.cjs

win:
  icon: resources/litroot-app-icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: '${productName}-${version}-windows-${arch}-unsigned-setup.${ext}'

nsis:
  oneClick: true
  perMachine: false
  packElevateHelper: false

publish: null
